name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unit tests
        run: node --test

  action:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      # Checkout scans only. `repos` is unset, so watch mode does not run
      # and fixtures/evil cannot open a tracking issue. Do not point `path`
      # at the repository root.
      - uses: actions/checkout@v4
      - name: Scan the clean fixture
        id: clean
        uses: ./
        with:
          path: fixtures/clean
          comment: 'false'
      - name: Scan the evil fixture
        id: evil
        uses: ./
        with:
          path: fixtures/evil
          comment: 'false'
      - name: fail-under trips on the evil fixture
        id: gated
        continue-on-error: true
        uses: ./
        with:
          path: fixtures/evil
          comment: 'false'
          fail-under: '80'
      - name: Deep Scan without a key is skipped and changes nothing
        id: deepskip
        uses: ./
        with:
          path: fixtures/evil
          comment: 'false'
          deep-scan: 'true'
          ai-model: ci-no-key
      - name: Check action outputs
        env:
          CLEAN_SCORE: ${{ steps.clean.outputs.score }}
          CLEAN_BAND: ${{ steps.clean.outputs.band }}
          EVIL_SCORE: ${{ steps.evil.outputs.score }}
          EVIL_BAND: ${{ steps.evil.outputs.band }}
          EVIL_REPORT: ${{ steps.evil.outputs.report-path }}
          GATED: ${{ steps.gated.outcome }}
          SKIP_SCORE: ${{ steps.deepskip.outputs.score }}
          SKIP_STATUS: ${{ steps.deepskip.outputs.deep-status }}
        run: |
          set -eu
          echo "clean ${CLEAN_SCORE} ${CLEAN_BAND}"
          echo "evil ${EVIL_SCORE} ${EVIL_BAND} ${EVIL_REPORT}"
          test "${CLEAN_SCORE}" -ge 85
          test "${CLEAN_BAND}" = "green"
          test "${EVIL_SCORE}" -lt 45
          test "${EVIL_BAND}" = "red"
          test "${GATED}" = "failure"
          test "${SKIP_STATUS}" = "skipped"
          test "${SKIP_SCORE}" = "${EVIL_SCORE}"
          test -n "${EVIL_REPORT}"
          test -f "${EVIL_REPORT}"
          node -e "const r=require(process.argv[1]); if (r.score>=45||r.band.key!=='red') process.exit(1)" "${EVIL_REPORT}"
